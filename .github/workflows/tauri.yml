name: Tauri


on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


permissions:
  contents: read
  statuses: write


jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck and test
        run: npm test && npm run typecheck
        working-directory: frontend
      - name: Report required Tauri status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'Tauri / check',
              description: 'Tauri check ' + state,
              target_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
            });


  e2e:
    name: ${{ matrix.job }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: wdio-macos-arm64
            os: macos-latest
          - job: wdio-macos-intel
            os: macos-15-intel
          - job: wdio-windows
            os: windows-latest
          - job: wdio-linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: WebdriverIO desktop smoke
        if: runner.os != 'Linux'
        run: npm run test:e2e
        working-directory: frontend
      - name: WebdriverIO desktop smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run npm run test:e2e
        working-directory: frontend


  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:mac
            artifact: macos-arm64
          - os: macos-15-intel
