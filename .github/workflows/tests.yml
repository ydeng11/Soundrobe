name: Tests

# Dummy change to verify required status checks on pull requests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit, type, and build checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install app dependencies
        run: npm ci
      - name: Run unit and type tests
        run: npm test && npm run typecheck
      - name: Build renderer
        run: npm run build:web

  lint:
    name: Lint (Rust and TypeScript)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install app dependencies
        run: npm ci
      - name: Run Rust linter
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run TypeScript checks
        run: npm run typecheck

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS ARM
            os: macos-latest
          - platform: macOS Intel
            os: macos-15-intel
          - platform: Windows
            os: windows-latest
          - platform: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: Install app dependencies
        run: npm ci
      - name: Run desktop tests
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Run desktop tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run npm run test:e2e

  required:
    name: Required tests
    if: always()
    needs: [unit, desktop, lint, rust-tests]
    runs-on: ubuntu-22.04
    steps:
      - name: Confirm all tests passed
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
        run: test "$UNIT_RESULT" = success && test "$DESKTOP_RESULT" = success && test "$LINT_RESULT" = success && test "$RUST_TESTS_RESULT" = success
