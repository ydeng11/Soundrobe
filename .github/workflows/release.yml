name: Release

on:
  push:
    tags:
      - "v*.*.*"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check version
    runs-on: ubuntu-22.04
    outputs:
      release_needed: ${{ steps.version.outputs.release_needed }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = \"\([^\"]*\)\"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          release_tag="v$package_version"

          test -z "$PUSHED_TAG" || test "$PUSHED_TAG" = "$release_tag" || {
            echo "Release tag $PUSHED_TAG does not match package version $package_version" >&2
            exit 1
          }
          test "$tauri_version" = "$package_version" || {
            echo "Tauri version $tauri_version does not match package version $package_version" >&2
            exit 1
          }
          test "$cargo_version" = "$package_version" || {
            echo "Cargo version $cargo_version does not match package version $package_version" >&2
            exit 1
          }

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "$release_tag is already published."
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "$release_tag is not published and will be built."
          fi

  bundle:
    name: Build ${{ matrix.artifact }} release bundle
    if: needs.version.outputs.release_needed == 'true'
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:mac
            artifact: macos-arm64
            release_os: macos
            release_arch: arm64
          - os: macos-15-intel
            command: npm run dist:mac
            artifact: macos-intel
            release_os: macos
            release_arch: intel
          - os: windows-latest
            command: npm run dist:win
            artifact: windows-x64
            release_os: windows
            release_arch: x64
          - os: ubuntu-22.04
            command: npm run dist:linux
            artifact: linux-x64
            release_os: linux
            release_arch: x64
          - os: ubuntu-24.04-arm
            command: npm run dist:linux
            artifact: linux-arm64
            release_os: linux
            release_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: Install app dependencies
        run: npm ci
      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY GitHub secret is required for updater artifacts" >&2
            exit 1
          }
      - name: Build signed macOS updater release bundles
        if: runner.os == 'macOS'
        env:
          CI: "true"
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: ${{ matrix.command }} -- --config src-tauri/tauri.updater.conf.json
      - name: Build signed updater release bundles
        if: runner.os != 'macOS'
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: ${{ matrix.command }} -- --config src-tauri/tauri.updater.conf.json
      - name: Rename macOS release bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          updaters=(src-tauri/target/release/bundle/macos/*.app.tar.gz)
          test "${#dmgs[@]}" -eq 1 || { echo "Expected exactly one DMG" >&2; exit 1; }
          test "${#updaters[@]}" -eq 1 || { echo "Expected exactly one macOS updater archive" >&2; exit 1; }
          test -f "${updaters[0]}.sig" || { echo "Missing macOS updater signature" >&2; exit 1; }
          dmg_target="src-tauri/target/release/bundle/dmg/soundrobe-${version}-${{ matrix.release_os }}-${{ matrix.release_arch }}.dmg"
          updater_target="src-tauri/target/release/bundle/macos/soundrobe-${version}-${{ matrix.release_os }}-${{ matrix.release_arch }}.app.tar.gz"
          mv "${dmgs[0]}" "$dmg_target"
          mv "${updaters[0]}" "$updater_target"
          mv "${updaters[0]}.sig" "${updater_target}.sig"
      - name: Rename Windows release bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          $signature = "$($installers[0].FullName).sig"
          if (-not (Test-Path $signature)) { throw "Missing NSIS updater signature" }
          $target = Join-Path $installers[0].DirectoryName "soundrobe-$version-${{ matrix.release_os }}-${{ matrix.release_arch }}-setup.exe"
          Move-Item $installers[0].FullName $target
          Move-Item $signature "$target.sig"
      - name: Rename Linux release bundles
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#appimages[@]}" -eq 1 || { echo "Expected exactly one AppImage" >&2; exit 1; }
          test "${#debs[@]}" -eq 1 || { echo "Expected exactly one deb package" >&2; exit 1; }
          test -f "${appimages[0]}.sig" || { echo "Missing AppImage updater signature" >&2; exit 1; }
          test -f "${debs[0]}.sig" || { echo "Missing deb updater signature" >&2; exit 1; }
          appimage_target="src-tauri/target/release/bundle/appimage/soundrobe-${version}-${{ matrix.release_os }}-${{ matrix.release_arch }}.AppImage"
          deb_target="src-tauri/target/release/bundle/deb/soundrobe-${version}-${{ matrix.release_os }}-${{ matrix.release_arch }}.deb"
          mv "${appimages[0]}" "$appimage_target"
          mv "${appimages[0]}.sig" "${appimage_target}.sig"
          mv "${debs[0]}" "$deb_target"
          mv "${debs[0]}.sig" "${deb_target}.sig"
      - name: Smoke macOS app bundle and DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$(find src-tauri/target/release/bundle/macos -name '*.app' -print -quit)"
          dmg="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$app"
          test -n "$dmg"
          codesign --verify --deep --strict "$app"
          hdiutil verify "$dmg"
          "$app/Contents/MacOS/soundrobe" &
          pid=$!
          sleep 5
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true
      - name: Smoke Windows NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $install = Start-Process $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "NSIS installer exited with $($install.ExitCode)" }
          $appPath = Join-Path $env:LOCALAPPDATA "Soundrobe/soundrobe.exe"
          if (-not (Test-Path $appPath)) { throw "Installed application not found at $appPath" }
          $app = Start-Process $appPath -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Installed application exited with $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
      - name: Smoke Linux AppImage bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 15s xvfb-run "$appimage"
          status=$?
          set -e
          test "$status" -eq 124
      - name: Smoke Linux deb installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb="$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "$deb"
          sudo dpkg -i "$deb"
          set +e
          timeout 15s xvfb-run /usr/bin/soundrobe
          status=$?
          set -e
          test "$status" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, bundle]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
      - name: List release assets
        run: find release-assets -type f -print
      - name: Generate and verify updater manifest
        run: |
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/generate-updater-manifest.mjs \
            --assets release-assets \
            --tag "${{ needs.version.outputs.release_tag }}" \
            --pub-date "$pub_date" \
            --changelog docs/CHANGELOG.md \
            --output release-assets/latest.json
          node -e "const m=require('./release-assets/latest.json'); if (Object.keys(m.platforms).length !== 7) throw new Error('latest.json must contain seven installer-aware targets')"
      - name: Create GitHub release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Soundrobe ${{ needs.version.outputs.release_tag }}
          generate_release_notes: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*-setup.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.app.tar.gz
            release-assets/**/*.sig
            release-assets/latest.json
          fail_on_unmatched_files: true
