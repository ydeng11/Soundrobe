[package]
name = "soundrobe"
version = "0.1.1"
description = "Audio metadata editor with desktop and headless web runtimes"
authors = ["Soundrobe Contributors"]
license = "MIT"
homepage = "https://github.com/ydeng11/Soundrobe"
# Lofty 0.24 (the mandated Rust tag-I/O crate) requires Rust 1.85.
rust-version = "1.85"
edition = "2021"

[lib]
name = "soundrobe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "soundrobe"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "soundrobe-server"
path = "src/bin/soundrobe-server.rs"
required-features = ["server"]

[build-dependencies]
tauri-build = { version = "2.6", features = [], optional = true }

[dependencies]
tauri = { version = "2.11", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7", optional = true }
tauri-plugin-clipboard-manager = { version = "2.3", optional = true }
tauri-plugin-updater = { version = "2.10.1", optional = true }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal"] }
dirs = "6"
# Reader plus format-by-format writer cores, enabled only behind differential
# media-safety tests before command exposure.
lofty = "0.24.0"
libc = "0.2"
memchr = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
chardetng = "0.1"
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
opencc-fmmseg = "0.11"
sha2 = "0.10"
regex = "1"
semver = "1"
subtle = { version = "2", optional = true }
tokio-util = { version = "0.7", optional = true }
futures-util = { version = "0.3", optional = true }
url = { version = "2", optional = true }
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

# Infrastructure crates — pinned to the versions locked by `Cargo.lock` and
# introduced per migration slice. Listed here so the toolchain is recorded;
# each slice enables only what it needs to keep SLOC change review bounded.
#   opencc-fmmseg = "0.11"                                      # pure Rust OpenCC SC/TC conversion
#   futures    = "0.3"                                           # provider/blocking task orchestration

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[features]
# Desktop remains the default for Tauri CLI compatibility. The server feature
# deliberately excludes Tauri/WebKit and builds only the headless binary.
default = ["desktop"]
desktop = [
  "dep:tauri-build",
  "dep:tauri",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-clipboard-manager",
  "dep:tauri-plugin-updater",
]
server = ["dep:axum", "dep:tower", "dep:subtle", "dep:tokio-util", "dep:futures-util", "dep:url"]
wdio = ["desktop", "dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

# memchr uses explicit SIMD intrinsics (SSE2/AVX2 on x86_64, NEON on aarch64)
# that need at least -O1 to inline and eliminate loop overhead.  Compiling it
# with opt-level 3 in debug mode keeps the rest of the crate fast to build
# while making substring search fast in every profile.
[profile.dev.package.memchr]
opt-level = 3
